<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Request a Ride</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h1>RideBook</h1>
      <p class="instruction" id="instruction">Click the map to set your pickup location</p>
      <div id="ride-controls" class="hidden">
        <button id="request-btn">Request Ride</button>
        <button id="reset-btn">Reset</button>
      </div>
      <h2>Requested Rides</h2>
      <ul id="rides-list"></ul>
    </div>
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
