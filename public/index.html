<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RideBook - Bolt Style</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0d1a; color: #ffffff; font-family: 'Inter', sans-serif; overflow: hidden; }
    #rider-app { height: 100vh; width: 100vw; position: relative; overflow: hidden; background: #0d0d1a; }

    /* --- BOTTOM NAV --- */
    #bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: #15152a; border-top: 1px solid #2a2a4e; display: flex; justify-content: space-around; align-items: center; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #6b6b8d; cursor: pointer; background: transparent; border: none; font-family: 'Inter', sans-serif; }
    .nav-item.active { color: #00d4aa; }
    .nav-item .icon { font-size: 1.6rem; }
    .nav-item .label { font-size: 0.7rem; margin-top: 4px; }

    /* --- HOME SCREEN --- */
    #home-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 80px; background: #0d0d1a; z-index: 4; padding: 20px; overflow-y: auto; display: block; }
    
    /* --- TOP BAR --- */
    .home-top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .home-title { font-size: 1.8rem; font-weight: 700; color: #ffffff; line-height: 1.2; }
    .profile-btn { background: #15152a; border: 1px solid #2a2a4e; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 1.4rem; cursor: pointer; transition: all 0.3s; flex-shrink: 0; margin-top: 4px; }
    .profile-btn:hover { border-color: #00d4aa; }

    /* --- SEARCH INPUTS --- */
    #search-container { margin-bottom: 20px; }
    .input-group { background: #15152a; border-radius: 12px; padding: 4px 16px; margin-bottom: 12px; display: flex; align-items: center; border: 1px solid #2a2a4e; position: relative; }
    .input-group:focus-within { border-color: #00d4aa; }
    .input-group input { flex: 1; background: transparent; border: none; padding: 14px 0; color: #ffffff; font-size: 1rem; font-family: 'Inter', sans-serif; outline: none; }
    .input-group input::placeholder { color: #6b6b8d; }
    .input-group .icon { margin-right: 12px; color: #6b6b8d; }

    /* --- MAP SCREEN --- */
    /* Kept in the layout (not display:none) so the Leaflet map can initialize
       immediately on load — needed so a GPS fix can drop a real pickup pin
       before the user ever opens this screen. */
    #map-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; opacity: 0; pointer-events: none; background: #0d0d1a; transition: opacity 0.15s ease; }
    #map-screen.open { z-index: 10; opacity: 1; pointer-events: auto; }
    #rider-map { height: 100vh; width: 100vw; z-index: 0; }
    .map-top-bar { position: absolute; top: 40px; left: 16px; right: 16px; background: #15152a; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; border: 1px solid #2a2a4e; }
    .map-top-bar .close-map { font-size: 1.5rem; cursor: pointer; color: #ffffff; background: none; border: none; }
    .map-top-bar .route-info { font-weight: 500; color: #ffffff; flex: 1; text-align: center; font-size: 0.9rem; }

    /* --- RIDE OPTIONS SHEET --- */
    .ride-options-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: #15152a; border-radius: 24px 24px 0 0; padding: 20px; z-index: 10; max-height: 50vh; overflow-y: auto; border-top: 1px solid #2a2a4e; }
    .ride-option { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a2a4e; cursor: pointer; }
    .ride-option:last-child { border-bottom: none; }
    .ride-option .car-icon { font-size: 2rem; margin-right: 16px; width: 50px; text-align: center; }
    .ride-option .details { flex: 1; }
    .ride-option .details .name { font-weight: 600; color: #ffffff; }
    .ride-option .details .sub { font-size: 0.8rem; color: #6b6b8d; }
    .ride-option .price { font-weight: 700; color: #00d4aa; text-align: right; }
    
    .select-ride-btn { width: 100%; padding: 16px; background: #00d4aa; color: #0d0d1a; border: none; border-radius: 40px; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 16px; }

    /* --- LIVE TRACKING PANEL --- */
    .tracking-panel.hidden { display: none; }
    .tracking-status { font-size: 1.05rem; font-weight: 600; color: #ffffff; text-align: center; padding: 8px 0 4px; }
    .tracking-eta { font-size: 0.85rem; color: #00d4aa; text-align: center; font-weight: 600; margin-bottom: 4px; }
    .driver-car-icon { background: transparent; border: none; font-size: 1.7rem; line-height: 32px; text-align: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }

    /* --- PROFILE MODAL --- */
    #profile-modal { position: absolute; top: 80px; right: 20px; width: 280px; background: #15152a; border-radius: 16px; padding: 20px; z-index: 30; display: none; border: 1px solid #2a2a4e; box-shadow: 0 8px 30px rgba(0,0,0,0.8); }
    #profile-modal.open { display: block; }
    .profile-modal-header { font-size: 1.2rem; font-weight: 600; color: #ffffff; margin-bottom: 16px; border-bottom: 1px solid #2a2a4e; padding-bottom: 12px; display: flex; justify-content: space-between; }
    .profile-modal-header span { cursor: pointer; color: #6b6b8d; }
    .profile-detail { margin-bottom: 12px; }
    .profile-detail .label { font-size: 0.8rem; color: #6b6b8d; }
    .profile-detail .value { font-size: 1rem; font-weight: 500; color: #ffffff; }
    .logout-btn-modal { width: 100%; padding: 12px; background: #ff6b6b; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 12px; }

    /* --- RIDES PAGE --- */
    #page-container { position: absolute; top: 0; left: 0; right: 0; bottom: 80px; background: #0d0d1a; z-index: 5; overflow-y: auto; padding: 20px; display: none; }
    #page-container.open { display: block; }
    .page-header { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; color: #ffffff; }
    #rides-list-container { padding-bottom: 20px; }
    .ride-history-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #15152a; }
    .ride-history-item .h-info { flex: 1; }
    .ride-history-item .h-info .addr { font-weight: 500; color: #ffffff; font-size: 0.9rem; }
    .ride-history-item .h-price { font-weight: 600; color: #00d4aa; }

    /* --- AUTOCOMPLETE DROPDOWN --- */
    .autocomplete-dropdown { position: absolute; top: 100%; left: 0; width: 100%; background: #15152a; border: 1px solid #2a2a4e; border-top: none; border-radius: 0 0 12px 12px; max-height: 200px; overflow-y: auto; z-index: 1000; }
    .autocomplete-dropdown div { padding: 12px 16px; cursor: pointer; color: #ffffff; border-bottom: 1px solid #2a2a4e; }
    .autocomplete-dropdown div:hover { background: #00d4aa; }
  </style>
</head>
<body>
  <div id="rider-app">
    
    <!-- BOTTOM NAV -->
    <div id="bottom-nav">
      <button class="nav-item active" data-page="home"><span class="icon">🏠</span><span class="label">Home</span></button>
      <button class="nav-item" data-page="rides"><span class="icon">📋</span><span class="label">Rides</span></button>
    </div>

    <!-- HOME SCREEN -->
    <div id="home-screen">
      <div class="home-top-bar">
        <div class="home-title">Where are you going?</div>
        <button class="profile-btn" id="profile-btn">👤</button>
      </div>
      
      <!-- SEARCH BOXES -->
      <div id="search-container">
        <div class="input-group">
          <span class="icon">📍</span>
          <input type="text" id="pickup-search" placeholder="Detecting location..." />
        </div>
        <div class="input-group">
          <span class="icon">🏁</span>
          <input type="text" id="dropoff-search" placeholder="Where to?" />
        </div>
        <button id="open-map-btn" style="width:100%; margin-top:10px; padding:14px; background:#00d4aa; color:#0d0d1a; border:none; border-radius:12px; font-weight:600; cursor:pointer;">Find Rides</button>
      </div>
    </div>

    <!-- MAP SCREEN -->
    <div id="map-screen">
      <div id="rider-map"></div>
      <div class="map-top-bar">
        <button class="close-map" id="close-map-btn">✕</button>
        <span class="route-info" id="route-info-text">Select Pickup & Dropoff</span>
      </div>
      <div class="ride-options-sheet">
        <div id="ride-options-list" style="color:#6b6b8d; text-align:center; margin-bottom:10px;">
          Tap the map to set locations
        </div>
        <button class="select-ride-btn" id="confirm-ride-btn">Request Ride</button>

        <!-- LIVE DRIVER TRACKING (shown once a ride is requested) -->
        <div class="tracking-panel hidden" id="tracking-panel">
          <div class="tracking-status" id="tracking-status">🔎 Looking for a nearby driver...</div>
          <div class="tracking-eta" id="tracking-eta"></div>
        </div>
      </div>
    </div>

    <!-- PROFILE MODAL -->
    <div id="profile-modal">
      <div class="profile-modal-header">
        <span>Profile</span>
        <span id="close-profile">✕</span>
      </div>
      <div class="profile-detail"><div class="label">Name</div><div class="value" id="profile-name">Loading...</div></div>
      <div class="profile-detail"><div class="label">Email</div><div class="value" id="profile-email">Loading...</div></div>
      <div class="profile-detail"><div class="label">User ID</div><div class="value" id="profile-id">Loading...</div></div>
      <button class="logout-btn-modal" id="logout-btn">🚪 Logout</button>
    </div>

    <!-- RIDES PAGE -->
    <div id="page-container" data-page="rides">
      <div class="page-header">My Ride History</div>
      <div id="rides-list-container"></div>
    </div>
  </div>

  <!-- ✅ Scripts: Leaflet, Socket, and ONLY app.js (map.js is removed) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
