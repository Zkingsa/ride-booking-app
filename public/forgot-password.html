<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Forgot Password</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .login-box {
      background: #16213e;
      padding: clamp(24px, 6vw, 40px);
      border-radius: 12px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .login-box h1 {
      color: #00d4aa;
      margin-bottom: 8px;
    }
    .login-box h2 {
      margin: 0 0 6px;
      font-size: 1.1rem;
    }
    .sub-text {
      color: #aaaaaa;
      font-size: 0.85rem;
      margin: 0 0 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      background: #0f0f1e;
      color: #ffffff;
      box-sizing: border-box;
    }
    input:focus {
      outline: 2px solid #00d4aa;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #00d4aa;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #00b894;
    }
    .toggle-link {
      color: #aaaaaa;
      font-size: 0.9rem;
      margin-top: 15px;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }
    .toggle-link:hover {
      color: #00d4aa;
    }
    .msg {
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 40px;
      white-space: pre-wrap;
      word-break: break-all;
      text-align: left;
      background: #0f0f1e;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    .msg.success { color: #00d4aa; }
    .msg.error { color: #ff6b6b; }
    .msg a { color: #00d4aa; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>RideBook</h1>
    <h2>Forgot password</h2>
    <p class="sub-text">Enter the email you signed up with and we'll send you a reset link.</p>

    <input type="email" id="email-input" placeholder="Email Address" autocomplete="email">
    <button id="submit-btn">Send reset link</button>

    <div class="msg" id="msg"></div>
    <a href="login.html" class="toggle-link">← Back to login</a>
  </div>

  <script>
    const emailInput = document.getElementById('email-input');
    const submitBtn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    function showMsg(type, text) {
      msg.className = 'msg ' + type;
      msg.textContent = text;
      msg.style.display = 'block';
    }

    submitBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) { showMsg('error', 'Please enter your email address.'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) {
          showMsg('error', data.error || 'Something went wrong. Please try again.');
        } else {
          // Dev fallback: when no email service is configured the server returns
          // the reset link so the flow can still be tested locally.
          if (data.devResetLink) {
            showMsg('success', 'Local dev mode (no email service configured). Use this reset link:\n' + data.devResetLink);
          } else {
            showMsg('success', data.message || 'Reset link sent. Check your inbox.');
          }
        }
      } catch (err) {
        showMsg('error', 'Network error. Is the server running?');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset link';
      }
    });

    emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });
  </script>
</body>
</html>
