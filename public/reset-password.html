<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Reset Password</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .login-box {
      background: #16213e;
      padding: clamp(24px, 6vw, 40px);
      border-radius: 12px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .login-box h1 {
      color: #00d4aa;
      margin-bottom: 8px;
    }
    .login-box h2 {
      margin: 0 0 6px;
      font-size: 1.1rem;
    }
    .sub-text {
      color: #aaaaaa;
      font-size: 0.85rem;
      margin: 0 0 12px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      background: #0f0f1e;
      color: #ffffff;
      box-sizing: border-box;
    }
    input:focus {
      outline: 2px solid #00d4aa;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #00d4aa;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #00b894;
    }
    .toggle-link {
      color: #aaaaaa;
      font-size: 0.9rem;
      margin-top: 15px;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }
    .toggle-link:hover {
      color: #00d4aa;
    }
    .msg {
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 40px;
      white-space: pre-wrap;
      word-break: break-all;
      text-align: left;
      background: #0f0f1e;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    .msg.success { color: #00d4aa; }
    .msg.error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>RideBook</h1>
    <h2>Choose a new password</h2>
    <p class="sub-text" id="sub-text">Enter a new password for your account.</p>

    <input type="password" id="password-input" placeholder="New password" autocomplete="new-password">
    <input type="password" id="confirm-input" placeholder="Confirm new password" autocomplete="new-password">
    <button id="submit-btn">Update password</button>

    <div class="msg" id="msg"></div>
    <a href="login.html" class="toggle-link" id="back-link">← Back to login</a>
  </div>

  <script>
    const passwordInput = document.getElementById('password-input');
    const confirmInput = document.getElementById('confirm-input');
    const submitBtn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');
    const subText = document.getElementById('sub-text');

    // Token arrives in the URL: /reset-password.html?token=...
    function extractToken() {
      const params = new URLSearchParams(window.location.search);
      const fromParams = params.get('token');
      if (fromParams) return fromParams;
      // Some proxies/forwarded links percent-encode the '=' (e.g. ?token%3Dabc),
      // which URLSearchParams can't parse. Fall back to a manual scan.
      const raw = window.location.search;
      const m = raw.match(/[?&]token(?:%3D|=)([0-9a-fA-F]+)/);
      return m ? m[1] : null;
    }
    const token = extractToken();

    if (!token) {
      subText.textContent = 'This reset link is missing its token. Please request a new one.';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Link invalid';
    }

    function showMsg(type, text) {
      msg.className = 'msg ' + type;
      msg.textContent = text;
      msg.style.display = 'block';
    }

    submitBtn.addEventListener('click', async () => {
      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (!password || !confirm) { showMsg('error', 'Please fill in both fields.'); return; }
      if (password.length < 6) { showMsg('error', 'Password must be at least 6 characters.'); return; }
      if (password !== confirm) { showMsg('error', 'Passwords do not match.'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (!res.ok) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update password';
          showMsg('error', data.error || 'Something went wrong. Please try again.');
        } else {
          showMsg('success', data.message || 'Password updated!');
          subText.textContent = 'You can now log in with your new password.';
          submitBtn.disabled = true;
          submitBtn.textContent = 'Done';
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update password';
        showMsg('error', 'Network error. Is the server running?');
      }
    });

    confirmInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });
  </script>
</body>
</html>
